services:
  web:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./:/app
      - bun_cache:/root/.bun/install/cache
    command: sh -c "bun install && bun run dev --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - /run/base44/app.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  bun_cache:
